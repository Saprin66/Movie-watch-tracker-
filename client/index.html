<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover нужен, чтобы работали отступы под «чёлку» и полосу «домой» (safe-area) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08070e" />
    <meta name="color-scheme" content="dark" />
    <!-- Режим «приложения» при добавлении на экран «Домой» в iPhone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="yandex-verification" content="2200ae81bd02421f" />
    <meta name="google-site-verification" content="E7RWJNxTFN1zbzaSEnapLoy2gKVEYeYAn8D6cDizz4Q" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MovieGrade" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <title>MovieGrade — личный кинодневник: оценки, отзывы и списки фильмов</title>
    <meta
      name="description"
      content="MovieGrade — бесплатный кинодневник: отмечайте просмотренные фильмы, ставьте оценки, пишите отзывы, ведите список «посмотреть позже» и следите, что смотрят друзья."
    />
    <!-- Основной адрес сайта: дубли на *.vercel.app склеиваются с ним -->
    <link rel="canonical" href="https://sapringrade.ru/" />

    <!-- Превью ссылки в Telegram, VK, WhatsApp и соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MovieGrade" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://sapringrade.ru/" />
    <meta property="og:title" content="MovieGrade — личный кинодневник" />
    <meta
      property="og:description"
      content="Оценки, отзывы и списки на потом. А ещё то, что смотрят друзья."
    />
    <meta property="og:image" content="https://sapringrade.ru/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Структурированные данные для поисковиков -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MovieGrade",
        "url": "https://sapringrade.ru/",
        "description": "Личный кинодневник: оценки, отзывы, списки «посмотреть позже» и лента друзей.",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Web",
        "inLanguage": "ru",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "RUB" }
      }
    </script>
  </head>
  <body>
    <!-- Текст для роботов, которые не выполняют JavaScript (например, часть обходов Яндекса) -->
    <noscript>
      <h1>MovieGrade — личный кинодневник</h1>
      <p>
        Отмечайте просмотренные фильмы, ставьте оценки и пишите отзывы, ведите
        список «посмотреть позже», добавляйте друзей и смотрите, что они
        оценили. Для работы сайта включите JavaScript.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
